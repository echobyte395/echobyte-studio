<!DOCTYPE html>
<html>
<head>
  <title>QR Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">
  <h1>📊 QR Analytics PRO MAX</h1>
</div>

<div class="cards">

  <div class="card">
    <h2>Total scans</h2>
    <p id="total">0</p>
  </div>

  <div class="card">
    <h2>Pays uniques</h2>
    <p id="countries">0</p>
  </div>

  <div class="card">
    <h2>Villes uniques</h2>
    <p id="cities">0</p>
  </div>

</div>

<div class="chartBox">
  <canvas id="chart"></canvas>
</div>

<div id="map"></div>

<table id="table"></table>

<script src="app.js"></script>

</body>
</html>
